<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Bay — Open-World Crime Game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1420; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f5efe6; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
  .hud-stars { position: absolute; top: 14px; right: 20px; font-size: 30px; letter-spacing: 4px; }
  .hud-cash { position: absolute; top: 52px; right: 22px; font-size: 26px; font-weight: 700; color: #2ecc71; }
  .hud-mission { position: absolute; top: 14px; left: 18px; max-width: 420px; background: rgba(20,16,30,0.55); border-left: 4px solid #f2c94c; padding: 10px 14px; border-radius: 4px; }
  .hud-mission-name { font-size: 19px; font-weight: 700; color: #f2c94c; }
  .hud-mission-brief { font-size: 14px; color: #f5efe6; margin-top: 2px; }
  .hud-mission-timer { font-size: 22px; font-weight: 700; color: #ff8a5c; margin-top: 2px; }
  .hud-health { position: absolute; left: 18px; bottom: 18px; width: 220px; height: 16px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.35); border-radius: 8px; overflow: hidden; }
  .hud-health-bar { height: 100%; width: 100%; background: #2ecc71; }
  .hud-speed { position: absolute; right: 22px; bottom: 216px; font-size: 30px; font-weight: 700; }
  .hud-toast { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); max-width: 640px; text-align: center; font-size: 21px; font-weight: 600; background: rgba(20,16,30,0.72); padding: 12px 22px; border-radius: 8px; opacity: 0; transition: opacity 0.4s; }
  .hud-map { position: absolute; right: 18px; bottom: 18px; width: 190px; height: 190px; border: 2px solid rgba(255,255,255,0.35); border-radius: 6px; background: rgba(20,18,30,0.6); }
  .hud-panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 620px; max-width: 92vw; text-align: center; background: rgba(24, 16, 34, 0.82); border: 1px solid rgba(242, 201, 76, 0.5); border-radius: 12px; padding: 34px 30px 26px; display: none; }
  .hud-panel-title { font-size: 52px; font-weight: 800; letter-spacing: 6px; color: #f2c94c; margin-bottom: 10px; }
  .hud-panel-lines { font-size: 17px; line-height: 1.55; color: #f5efe6; }
  .hud-panel-prompt { margin-top: 22px; font-size: 18px; font-weight: 700; color: #7fd4c8; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sunset Bay: an open-world crime game. Steal cars, outrun the police, work jobs for Marla."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
